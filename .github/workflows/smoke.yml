name: smoke

# The toolbelt's safety contract, offline: shellcheck every script, then
# tests/smoke.sh (side-effect-free --help, install.sh refusing unknown options,
# project-init.sh honoring CREATE_GITHUB_REPO / PUSH_TO_GITHUB, the --dry-run
# of git_init.sh, forkme.sh, stashme.sh, project-init.sh, rename-directory.sh
# and create_package.sh writing nothing and making no gh, git network or
# docker stop call (project-init.sh's even when a sourced .env or --config sets
# DRY_RUN=false), a real stash still completing, rename-directory.sh --yes
# running with no stdin and naming the containers it already stopped when
# piped answers run out, and create_package.sh refusing a non-empty target
# without --force). The shared standard-ci.yml shellchecks nothing here, so
# this is the repo's own gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=warning *.sh FORKME/forkme.sh STASHME/stashme.sh tests/*.sh
      - name: smoke
        run: tests/smoke.sh
